<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Letterless between turns</title>

</head>
<body>




<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>

body{margin:0}
a{color:#1B1A17}a:hover{color:#000}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2ECDD; color: #1B1A17; font-family: 'Courier Prime', 'Courier New', Courier, monospace; padding: 36px 24px 28px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #4A4640">Round 1 of 2 · Turn 2 of 4</span>
<span style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #4A4640">Case K7Q2M</span>
</div>
<div style="background: #E3CF9F; border-radius: 4px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #4A3B17">Turn report</span>
<span style="font-family: 'Special Elite', 'Courier New', monospace; font-size: 26px; line-height: 1.1">Agent Fox cracked 5</span>
</div>
<span style="font-family: 'Special Elite', monospace; font-size: 22px; white-space: nowrap">+5 pts</span>
</div>
<div style="display: flex; flex-direction: column; border-top: 1px solid #8C857A">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #8C857A; font-size: 15px"><span style="font-weight: 700; letter-spacing: 0.04em">KITE</span><span>Agent Moth</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #8C857A; font-size: 15px"><span style="font-weight: 700; letter-spacing: 0.04em">CLOUD</span><span>Agent Wren</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #8C857A; font-size: 15px"><span style="font-weight: 700; letter-spacing: 0.04em">PLANET</span><span>Agent Badger</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #8C857A; font-size: 15px"><span style="font-weight: 700; letter-spacing: 0.04em">BLANKET</span><span>Agent Moth</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #8C857A; font-size: 15px; color: #4A4640"><span style="text-decoration: line-through; letter-spacing: 0.04em">HAMBURGER</span><span style="font-style: italic">passed</span></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #8C857A; font-size: 15px"><span style="font-weight: 700; letter-spacing: 0.04em">MONSTER</span><span>Agent Wren</span></div>
</div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center">
<span style="font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #4A4640">Next agent up</span>
<div style="font-family: 'Special Elite', 'Courier New', monospace; font-size: 46px; line-height: 1">Agent Wren</div>
<span style="border: 3px solid #B3261E; color: #B3261E; font-family: 'Special Elite', monospace; font-size: 18px; letter-spacing: 0.1em; padding: 4px 12px; transform: rotate(-5deg); border-radius: 3px">GET READY</span>
<div style="display: flex; align-items: baseline; gap: 10px; margin-top: 6px">
<span style="font-size: 15px">Briefing in</span>
<span style="font-family: 'Special Elite', monospace; font-size: 56px; line-height: 1; color: #B3261E">3</span>
</div>
<div style="font-size: 14px; color: #4A4640; max-width: 280px; line-height: 1.4">Everyone else: thumbs on keyboards.</div>
</div>
</div>


</body>
</html>
