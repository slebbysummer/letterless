<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #F2ECDD; color: #1B1A17; font-family: 'Courier Prime', monospace; position: relative; overflow: hidden; }
  .ref { position: absolute; top: 52px; left: 72px; font-size: 22px; letter-spacing: 0.18em; color: #4A4640; }
  h1 { position: absolute; top: 96px; left: 66px; margin: 0; font-family: 'Special Elite', monospace; font-weight: 400; font-size: 150px; line-height: 1; letter-spacing: -0.01em; }
  .tag { position: absolute; top: 272px; left: 74px; width: 560px; font-size: 32px; line-height: 1.35; }
  .card { position: absolute; top: 236px; right: 70px; width: 420px; padding: 30px 32px; background: #E3CF9F; border-radius: 6px; transform: rotate(-2deg); }
  .card .label { font-size: 18px; letter-spacing: 0.16em; color: #4A3B17; margin-bottom: 14px; }
  .card .clue { font-size: 28px; line-height: 1.45; }
  .card .answer { margin-top: 14px; font-family: 'Special Elite', monospace; font-size: 46px; text-align: right; }
  .stamp { position: absolute; left: 74px; bottom: 70px; border: 5px solid #B3261E; border-radius: 4px; color: #B3261E; font-family: 'Special Elite', monospace; font-size: 40px; letter-spacing: 0.1em; padding: 6px 18px; transform: rotate(-6deg); }
  .agents { position: absolute; left: 74px; top: 420px; font-size: 26px; color: #4A4640; }
</style></head>
<body>
  <div class="ref">FILE REF. LL-001</div>
  <h1>Letterless</h1>
  <div class="tag"><b>Your mission:</b> describe each word without any of its letters.</div>
  <div class="card">
    <div class="label">EXAMPLE BRIEFING</div>
    <div class="clue">&gt; BIG QUICK ANIMAL<br>&gt; NAAAY!<br>&gt; GIDDY-UP!<br>&gt; LIK A BIG DAWG</div>
    <div class="answer">= HORSE</div>
  </div>
  <div class="stamp">TOP SECRET</div>
  <div class="agents">A party word game for 2 to 8 agents</div>
</body></html>
